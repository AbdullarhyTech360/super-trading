[project]
name = "super-trading-backend"
version = "0.1.0"
description = "FastAPI backend for the Super Trading System (placeholder build)"
readme = "README.md"
requires-python = ">=3.11"

# Only what the placeholder service actually imports. Database and email
# dependencies stay out until phase 7 needs them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]
# Enabled together with the first real database models.
db = [
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
